server:
  port: 8080

spring:
  application:
    name: visiontwin-backend
  datasource:
    url: jdbc:h2:file:./data/visiontwin;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Custom storage and AI configurations
visiontwin:
  storage:
    upload-dir: ./data/uploads
    manual-dir: ./data/manuals
    userguide-dir: ./data/userguides
    thumbnail-dir: ./data/thumbnails
    refimage-dir: ./data/refimages
  ai:
    # Provider: 'gemini', 'openai', or 'mock' (default: mock for instant out-of-the-box local operation)
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:}
    model: ${AI_MODEL:gemini-1.5-flash}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-004}
