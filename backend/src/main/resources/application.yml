server:
  port: 8080

spring:
  application:
    name: visiontwin-backend
  data:
    mongodb:
      # MongoDB connection string. Set MONGODB_URI to your Atlas connection string
      # (e.g. mongodb+srv://user:pass@cluster0.xxxxx.mongodb.net/visiontwin?retryWrites=true&w=majority).
      # The database name is set explicitly below so it works even when the URI path is empty.
      uri: ${MONGODB_URI:mongodb://localhost:27017/visiontwin}
      database: ${MONGODB_DATABASE:visiontwin}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# Custom storage and AI configurations
visiontwin:
  storage:
    upload-dir: ./data/uploads
    manual-dir: ./data/manuals
    userguide-dir: ./data/userguides
    thumbnail-dir: ./data/thumbnails
    refimage-dir: ./data/refimages
  ai:
    # Provider: 'gemini', 'openai', or 'mock' (default: mock for instant out-of-the-box local operation)
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:}
    vision-model: ${AI_VISION_MODEL:gemini-3.6-flash}
    text-model: ${AI_TEXT_MODEL:gemini-3.6-flash}
    embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-004}
    # Models selectable at diagnosis time (Gemini API model IDs)
    available-models: ${AI_AVAILABLE_MODELS:gemini-3.6-flash,gemini-2.5-pro,gemini-2.5-flash,gemini-2.0-flash}
